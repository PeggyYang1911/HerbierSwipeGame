<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Herbier — associe la drogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F1ECDE;
    --parchment-dark:#E6DFCB;
    --ink:#26291F;
    --pine:#33422C;
    --pine-soft:#5B6B4C;
    --amber:#B98A2B;
    --rust:#A34632;
    --card-bg:#FBF8F0;
    --line: rgba(38,41,31,0.16);
    --shadow: 0 1px 0 rgba(38,41,31,0.06);
  }
  :root:not([data-theme="light"]){
    /* keep parchment even if system is dark, this is a paper-goods aesthetic */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --parchment:#1E1C16;
      --parchment-dark:#171510;
      --ink:#EFE9D8;
      --pine:#B7C7A8;
      --pine-soft:#93A183;
      --amber:#D9A94A;
      --rust:#D97A63;
      --card-bg:#2A2720;
      --line: rgba(239,233,216,0.16);
      --shadow: 0 1px 0 rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"]{
    --parchment:#1E1C16;
    --parchment-dark:#171510;
    --ink:#EFE9D8;
    --pine:#B7C7A8;
    --pine-soft:#93A183;
    --amber:#D9A94A;
    --rust:#D97A63;
    --card-bg:#2A2720;
    --line: rgba(239,233,216,0.16);
    --shadow: 0 1px 0 rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, var(--parchment-dark) 0%, var(--parchment) 55%);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100svh;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px));
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
    overscroll-behavior-y:contain;
  }

  .header{
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:15px;
    color:var(--pine-soft);
    margin:0 0 2px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:26px;
    margin:0;
    text-align:center;
    letter-spacing:0.2px;
  }
  .sub{
    font-size:13px;
    color:var(--pine-soft);
    margin-top:6px;
    text-align:center;
    max-width:320px;
    line-height:1.5;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:360px;
    height:min(520px, 58svh, 58vh);
    margin-top:6px;
  }

  .card{
    position:absolute;
    inset:0;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow: 0 10px 30px -12px rgba(38,41,31,0.35), var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    cursor:grab;
    will-change:transform;
    transform-origin:bottom center;
    user-select:none;
  }
  .card:active{cursor:grabbing;}
  .card.dragging{transition:none;}
  .card.settling{transition:transform 0.35s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease;}

  .card .frame{
    position:relative;
    margin:14px 14px 0;
    border:1px solid var(--line);
    padding:6px;
    background:var(--parchment);
  }
  .card .photo-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4/3;
    overflow:hidden;
    background:#0000;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:sepia(0.06) contrast(1.02);
    -webkit-touch-callout:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .label-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 20px 20px;
    text-align:center;
    gap:4px;
  }
  .fr-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:24px;
    line-height:1.15;
    margin-top:2px;
  }
  .latin-name{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:16px;
    color:var(--pine);
    margin-top:1px;
  }

  .stamp{
    position:absolute;
    top:22px;
    padding:6px 14px;
    border:2.5px solid;
    border-radius:4px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    opacity:0;
    transform:rotate(-14deg);
    pointer-events:none;
  }
  .stamp.match{ left:20px; color:var(--pine); border-color:var(--pine); }
  .stamp.nomatch{ right:20px; color:var(--rust); border-color:var(--rust); transform:rotate(14deg); }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    margin-top:22px;
  }
  .ctrl-btn{
    width:56px;height:56px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card-bg);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(38,41,31,0.12);
    transition:transform 0.12s ease;
    touch-action:manipulation;
  }
  .ctrl-btn:hover{transform:translateY(-2px);}
  .ctrl-btn:active{transform:translateY(0px) scale(0.94);}
  .ctrl-btn svg{width:22px;height:22px;}
  .ctrl-no svg{stroke:var(--rust);}
  .ctrl-yes svg{stroke:var(--pine);}

  .hint{
    font-size:12px;
    color:var(--pine-soft);
    margin-top:14px;
    text-align:center;
  }

  .scoreboard{
    width:100%;
    max-width:360px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:18px;
    font-size:12px;
    color:var(--pine-soft);
    letter-spacing:0.02em;
  }
  .progress-track{
    flex:1;
    height:3px;
    background:var(--line);
    margin:0 10px;
    position:relative;
    border-radius:2px;
    overflow:hidden;
  }
  .progress-fill{
    position:absolute;left:0;top:0;bottom:0;
    background:var(--pine-soft);
    width:0%;
    transition:width 0.3s ease;
  }

  .end-screen{
    max-width:360px;
    width:100%;
    text-align:center;
    padding:40px 22px;
    border:1px solid var(--line);
    background:var(--card-bg);
    border-radius:3px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .end-screen.show{display:flex;}
  .end-screen .big{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:40px;
  }
  .end-screen p{
    font-size:14px;
    color:var(--pine-soft);
    margin:0;
    line-height:1.5;
  }
  .replay-btn{
    margin-top:14px;
    font-family:'Inter';
    font-weight:600;
    font-size:14px;
    color:var(--parchment);
    background:var(--pine);
    border:none;
    padding:12px 26px;
    border-radius:3px;
    cursor:pointer;
    touch-action:manipulation;
  }
  .replay-btn:hover{opacity:0.92;}

  @media (max-width: 380px){
    h1{ font-size:22px; }
    .sub{ font-size:12.5px; }
    .fr-name{ font-size:21px; }
    .latin-name{ font-size:14px; }
    .ctrl-btn{ width:50px; height:50px; }
    .controls{ gap:18px; margin-top:18px; }
  }

  @media (max-height: 700px){
    .header{ margin-bottom:10px; }
    .sub{ display:none; }
    .stage{ height:min(440px, 54svh, 54vh); }
  }

  @media (prefers-reduced-motion: reduce){
    .card.settling{transition:none;}
  }

  .stage, .card{ touch-action: pan-y; }
</style>
</head>
<body>

  <div class="header">
    <p class="eyebrow">Sciences pharmaceutiques · TP botanique</p>
    <h1>Ça correspond ?</h1>
    <p class="sub">L'image montre une drogue végétale. Regarde le nom en dessous : est-ce le bon nom ? Glisse à droite si ça correspond, à gauche si non.</p>
  </div>

  <div class="stage" id="stage"></div>

  <div class="end-screen" id="endScreen">
    <p class="eyebrow" style="margin-bottom:0;">Terminé</p>
    <div class="big" id="finalScore">0/0</div>
    <p id="finalMsg">Bien joué.</p>
    <button class="replay-btn" id="replayBtn">Recommencer</button>
  </div>

  <div class="controls" id="controls">
    <button class="ctrl-btn ctrl-no" id="btnNo" aria-label="Ne correspond pas">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="ctrl-btn ctrl-yes" id="btnYes" aria-label="Correspond">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 12.5l5 5.5L20 6"/></svg>
    </button>
  </div>

  <div class="scoreboard">
    <span id="roundLabel">Carte 1/6</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span id="scoreLabel">Score 0</span>
  </div>

  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildDeck(){
  // one correct pairing + one incorrect pairing per specimen image
  const deck = [];
  SPECIMENS.forEach(s=>{
    deck.push({specimen:s, shown:s, isMatch:true});
    const others = SPECIMENS.filter(o=>o.id!==s.id);
    const wrong = others[Math.floor(Math.random()*others.length)];
    deck.push({specimen:s, shown:wrong, isMatch:false});
  });
  return shuffle(deck);
}

let deck = [];
let idx = 0;
let score = 0;
let dragging = false;
let startX = 0, startY = 0, curX = 0, curY = 0;
let currentCardEl = null;

const stage = document.getElementById('stage');
const roundLabel = document.getElementById('roundLabel');
const scoreLabel = document.getElementById('scoreLabel');
const progressFill = document.getElementById('progressFill');
const endScreen = document.getElementById('endScreen');
const controls = document.getElementById('controls');
const finalScore = document.getElementById('finalScore');
const finalMsg = document.getElementById('finalMsg');

function init(){
  deck = buildDeck();
  idx = 0;
  score = 0;
  endScreen.classList.remove('show');
  controls.style.display = 'flex';
  stage.style.display = 'block';
  render();
}

function render(){
  stage.innerHTML = '';
  if(idx >= deck.length){
    finish();
    return;
  }
  // render up to 2 cards for stack depth illusion (current + next peeking)
  const next = deck[idx+1];
  if(next){
    stage.appendChild(makeCardEl(next, true));
  }
  const cur = deck[idx];
  currentCardEl = makeCardEl(cur, false);
  stage.appendChild(currentCardEl);
  attachDrag(currentCardEl, cur);

  roundLabel.textContent = 'Carte ' + (idx+1) + '/' + deck.length;
  scoreLabel.textContent = 'Score ' + score;
  progressFill.style.width = (idx/deck.length*100) + '%';
}

function makeCardEl(entry, isBack){
  const card = document.createElement('div');
  card.className = 'card';
  if(isBack){
    card.style.transform = 'scale(0.94) translateY(10px)';
    card.style.opacity = '0.7';
    card.style.pointerEvents = 'none';
  }
  card.innerHTML = `
    <div class="frame">
      <div class="photo-wrap">
        <img src="${entry.specimen.img}" alt="">
      </div>
    </div>
    <div class="label-zone">
      <div class="fr-name">${entry.shown.fr}</div>
      <div class="latin-name">${entry.shown.latin}</div>
    </div>
    <div class="stamp match">Ça correspond</div>
    <div class="stamp nomatch">Faux nom</div>
  `;
  return card;
}

function attachDrag(card, entry){
  const onDown = (x,y)=>{
    dragging = true;
    startX = x; startY = y; curX = x; curY = y;
    card.classList.add('dragging');
    card.classList.remove('settling');
  };
  const onMove = (x,y)=>{
    if(!dragging) return;
    curX = x; curY = y;
    const dx = curX - startX;
    const dy = curY - startY;
    const rot = dx / 18;
    card.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    const matchStamp = card.querySelector('.stamp.match');
    const noStamp = card.querySelector('.stamp.nomatch');
    const t = Math.min(Math.abs(dx)/80, 1);
    if(dx > 0){ matchStamp.style.opacity = t; noStamp.style.opacity = 0; }
    else if(dx < 0){ noStamp.style.opacity = t; matchStamp.style.opacity = 0; }
    else { matchStamp.style.opacity = 0; noStamp.style.opacity = 0; }
  };
  const onUp = ()=>{
    if(!dragging) return;
    dragging = false;
    const dx = curX - startX;
    card.classList.remove('dragging');
    card.classList.add('settling');
    if(dx > 90){
      swipeAway(card, 1, entry);
    } else if(dx < -90){
      swipeAway(card, -1, entry);
    } else {
      card.style.transform = '';
      const matchStamp = card.querySelector('.stamp.match');
      const noStamp = card.querySelector('.stamp.nomatch');
      matchStamp.style.opacity = 0;
      noStamp.style.opacity = 0;
    }
  };

  card.addEventListener('mousedown', e=>{ onDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e=>{ if(dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', ()=>{ if(dragging) onUp(); });

  card.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    onDown(t.clientX, t.clientY);
  }, {passive:true});
  card.addEventListener('touchmove', e=>{
    const t = e.touches[0];
    onMove(t.clientX, t.clientY);
  }, {passive:true});
  card.addEventListener('touchend', ()=>{ onUp(); });
}

function swipeAway(card, dir, entry){
  const flyX = dir * 600;
  const flyRot = dir * 30;
  card.style.transform = `translate(${flyX}px, ${curY-startY}px) rotate(${flyRot}deg)`;
  card.style.opacity = '0';
  registerAnswer(dir > 0, entry);
  setTimeout(()=>{
    idx++;
    render();
  }, 260);
}

function registerAnswer(userSaysMatch, entry){
  const correct = (userSaysMatch === entry.isMatch);
  if(correct) score++;
}

function manualSwipe(dir){
  if(!currentCardEl) return;
  const entry = deck[idx];
  currentCardEl.classList.add('settling');
  swipeAway(currentCardEl, dir, entry);
}

document.getElementById('btnNo').addEventListener('click', ()=>manualSwipe(-1));
document.getElementById('btnYes').addEventListener('click', ()=>manualSwipe(1));

function finish(){
  stage.style.display = 'none';
  controls.style.display = 'none';
  roundLabel.textContent = 'Carte ' + deck.length + '/' + deck.length;
  progressFill.style.width = '100%';
  scoreLabel.textContent = 'Score ' + score;
  finalScore.textContent = score + '/' + deck.length;
  let msg = 'Continue à réviser, tu vas y arriver.';
  if(score === deck.length) msg = 'Parfait ! Les trois drogues sont acquises.';
  else if(score >= deck.length*0.7) msg = 'Bien joué, presque parfait.';
  finalMsg.textContent = msg;
  endScreen.classList.add('show');
}

document.getElementById('replayBtn').addEventListener('click', init);

init();
</script>
</body>
</html>
